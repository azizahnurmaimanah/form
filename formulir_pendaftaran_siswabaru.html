<!DOCTYPE html>
<html>
    
    <body>
        <div style="font-family: Georgia; font-size: medium;">
            <h1>Formulir</h1>
            <p><h5 style="color: rgb(92, 92, 92);">SMK Bukit Asam Informatika - Tahun Ajaran 2026/2027</h5></p>
        </div>

        <div style="font-family: Georgia; font-size: small;">
            <form method="get">
                <fieldset>
                <p>
                <label>Nama Lengkap:</label>
                <input type="text" name="nama" placeholder="Masukkan nama" required>
                </p>

                <p>
                <label>Email Aktif:</label>
                <input type="email" name="email" placeholder="Masukkan email" required>
                </p>

                <p>
                <label>Jenis Kelamin: </label><br>
                <input type="radio" name="jenis kelamin" value="lanang">
                <label>Laki-laki</label>

                <input type="radio" name="jenis kelamin" value="wedok">
                <label>Perempuan</label>
                </p>


                <p>
                <label>Pilihan Kosentrasi Keahlian</label> <br>
                <select id="Keahlian">
                <option value="rpl">Rekayasa Perangkat Lunak</option>
                <option value="tkj">Teknik Instalasi jaringan</option>
                <option value="dkv">Desain Komunikasi Visual</option>
                </select>
                </p>
                
                <p>
                <label>Minat Ekstrakulikuler: </label><br>
                <label><input type="checkbox" name="ekstrakulikuler" value="coding">Coding</label>
                <label>&nbsp &nbsp<input type="checkbox" name="ekstrakulikuler" value="pramuk">Pramuka</label><br>
                <label><input type="checkbox" name="ekstrakulikuler" value="paskib">Paskibra</label> 
                <label><input type="checkbox" name="ekstrakulikuler" value="E-sport Dev">E-Sport Development</label>
                </p>
                
                <label for="alamat">Alamat tempat tinggal</label><br>
                <textarea name="alamat" rowspan="50" colspan="50" placeholder="Tulis Alamat anda" required></textarea>

                <p>
                    <input type="submit" name="submit" value="Daftar Sekarang">
                    <input type="reset" name="reset" value="Kosongkan halaman">
                </p>
            </div>

            </fieldset>
        </form>
    </body>
</html>
